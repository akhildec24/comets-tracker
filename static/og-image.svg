<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1525"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd88"/>
      <stop offset="60%" stop-color="#ffaa33"/>
      <stop offset="100%" stop-color="#ff8833" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4488ff"/>
      <stop offset="100%" stop-color="#113355"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="250" cy="120" r="1.5"/>
    <circle cx="450" cy="60" r="1"/>
    <circle cx="700" cy="100" r="1"/>
    <circle cx="900" cy="70" r="1.5"/>
    <circle cx="1050" cy="140" r="1"/>
    <circle cx="1150" cy="90" r="1"/>
    <circle cx="150" cy="500" r="1"/>
    <circle cx="350" cy="550" r="1.5"/>
    <circle cx="600" cy="520" r="1"/>
    <circle cx="850" cy="480" r="1"/>
    <circle cx="1100" cy="530" r="1.5"/>
  </g>

  <!-- Orbits -->
  <ellipse cx="600" cy="315" rx="180" ry="180" fill="none" stroke="#1a3a5a" stroke-width="1" opacity="0.4"/>
  <ellipse cx="600" cy="315" rx="280" ry="280" fill="none" stroke="#1a3a5a" stroke-width="1" opacity="0.3"/>
  <ellipse cx="600" cy="315" rx="400" ry="400" fill="none" stroke="#1a3a5a" stroke-width="1" opacity="0.2"/>

  <!-- Sun -->
  <circle cx="600" cy="315" r="60" fill="url(#sun)"/>
  <circle cx="600" cy="315" r="35" fill="#ffcc66"/>

  <!-- Earth -->
  <circle cx="780" cy="315" r="14" fill="url(#earth)"/>

  <!-- Mars -->
  <circle cx="880" cy="280" r="10" fill="#cc5533"/>

  <!-- Jupiter -->
  <circle cx="1000" cy="350" r="24" fill="#c4a878"/>

  <!-- Comet -->
  <circle cx="400" cy="200" r="4" fill="#00ccff"/>
  <path d="M400 200 L320 140" stroke="#00ccff" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#e0f0ff" letter-spacing="3">NEO TRACKER</text>
  <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6080a0" letter-spacing="2">3D SOLAR SYSTEM EXPLORER</text>

  <!-- Bottom tagline -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4a6080" letter-spacing="1">Real-time orbital mechanics · Powered by NASA JPL data</text>
</svg>
