<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#05080f" />
		<meta name="description" content="Interactive 3D solar system explorer with real-time orbital mechanics. Track comets, asteroids, and near-Earth objects using live NASA JPL data. Explore planets, moons, and small bodies in an immersive WebGL visualization." />
		<meta name="keywords" content="solar system, 3D visualization, NASA, JPL, comets, asteroids, near-Earth objects, NEO, orbital mechanics, astronomy, space, planets, WebGL, Three.js" />
		<meta name="author" content="NEO Tracker" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="NEO Tracker — 3D Solar System Explorer" />
		<meta property="og:description" content="Interactive 3D solar system with real-time orbital mechanics powered by NASA JPL data. Track comets, asteroids, and explore planets in WebGL." />
		<meta property="og:image" content="/og-image.svg" />
		<meta property="og:site_name" content="NEO Tracker" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="NEO Tracker — 3D Solar System Explorer" />
		<meta name="twitter:description" content="Interactive 3D solar system with real-time orbital mechanics powered by NASA JPL data." />
		<meta name="twitter:image" content="/og-image.svg" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
